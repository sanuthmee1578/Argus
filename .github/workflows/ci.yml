
name: Argus CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libseccomp development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev pkg-config

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -count=1 ./...

      - name: Run race detector
        run: go test -race -count=1 ./...

      - name: Build Argus CLI
        run: |
          mkdir -p dist
          go build -o dist/argus .
          go build -o dist/argus-exec ./cmd/argus-exec

      - name: Verify CLI
        run: |
          ./dist/argus version
          ./dist/argus help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argus-linux-amd64
          path: dist/
          retention-days: 7
