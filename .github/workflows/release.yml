
name: Argus Release Packaging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and Package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev pkg-config

      - name: Run tests
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.2.0-preview"
          PACKAGE="argus-${VERSION}-linux-amd64"

          mkdir -p "dist/${PACKAGE}/config"

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build \
            -ldflags="-X argus/internal/cli.Version=${VERSION}" \
            -o "dist/${PACKAGE}/argus" .

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build \
            -o "dist/${PACKAGE}/argus-exec" ./cmd/argus-exec

          cp config/policy.json "dist/${PACKAGE}/config/"
          cp README.md "dist/${PACKAGE}/"

          if [ -f LICENSE ]; then
            cp LICENSE "dist/${PACKAGE}/"
          fi

          "dist/${PACKAGE}/argus" version

          tar -czf "dist/${PACKAGE}.tar.gz" \
            -C dist "${PACKAGE}"

          cd dist
          sha256sum "${PACKAGE}.tar.gz" > SHA256SUMS

      - name: Smoke test packaged release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.2.0-preview"
          PACKAGE="argus-${VERSION}-linux-amd64"

          mkdir -p release-check
          tar -xzf "dist/${PACKAGE}.tar.gz" -C release-check

          INSTALL_DIR="${GITHUB_WORKSPACE}/release-check/${PACKAGE}"

          # Confirm required files are present
          test -x "${INSTALL_DIR}/argus"
          test -x "${INSTALL_DIR}/argus-exec"
          test -f "${INSTALL_DIR}/config/policy.json"

          # Verify the archive checksum
          (
            cd dist
            sha256sum -c SHA256SUMS
          )

          # Run from outside the installation directory
          cd /tmp

          "${INSTALL_DIR}/argus" version | grep -F "0.2.0-preview"
          "${INSTALL_DIR}/argus" help | grep -F "setup-rootfs"

                    # Verify executable-relative policy discovery
          "${INSTALL_DIR}/argus" doctor > /tmp/argus-release-doctor.log || true
          grep -F "[PASS] Policy configuration" /tmp/argus-release-doctor.log
          grep -F "${INSTALL_DIR}/config/policy.json" /tmp/argus-release-doctor.
          
          echo "Release package smoke tests passed."
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: argus-release-preview
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          retention-days: 7
