
name: Argus Release Packaging

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Build and Package
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev pkg-config

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $GITHUB_REF_NAME"
              exit 1
            fi

            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.2.0-preview"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Selected Argus version: $VERSION"

      - name: Run tests
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="argus-${VERSION}-linux-amd64"

          mkdir -p "dist/${PACKAGE}/config"

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build \
            -ldflags="-X argus/internal/cli.Version=${VERSION}" \
            -o "dist/${PACKAGE}/argus" .

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build \
            -o "dist/${PACKAGE}/argus-exec" ./cmd/argus-exec

          cp config/policy.json "dist/${PACKAGE}/config/"
          cp README.md "dist/${PACKAGE}/"

          if [ -f LICENSE ]; then
            cp LICENSE "dist/${PACKAGE}/"
          fi

          "dist/${PACKAGE}/argus" version

          tar -czf "dist/${PACKAGE}.tar.gz" \
            -C dist "${PACKAGE}"

          cd dist
          sha256sum "${PACKAGE}.tar.gz" > SHA256SUMS

      - name: Smoke test packaged release
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="argus-${VERSION}-linux-amd64"

          mkdir -p release-check
          tar -xzf "dist/${PACKAGE}.tar.gz" -C release-check

          INSTALL_DIR="${GITHUB_WORKSPACE}/release-check/${PACKAGE}"

          # Confirm required files are present
          test -x "${INSTALL_DIR}/argus"
          test -x "${INSTALL_DIR}/argus-exec"
          test -f "${INSTALL_DIR}/config/policy.json"

          # Verify the archive checksum
          (
            cd dist
            sha256sum -c SHA256SUMS
          )

          # Run from outside the installation directory
          cd /tmp

          "${INSTALL_DIR}/argus" version | grep -F "$VERSION"
          "${INSTALL_DIR}/argus" help | grep -F "setup-rootfs"

          # Verify executable-relative policy discovery
          DOCTOR_LOG="${RUNNER_TEMP}/argus-release-doctor.log"

          "${INSTALL_DIR}/argus" doctor > "${DOCTOR_LOG}" || true

          grep -F "[PASS] Policy configuration" "${DOCTOR_LOG}"
          grep -F "${INSTALL_DIR}/config/policy.json" "${DOCTOR_LOG}"
          
          echo "Release package smoke tests passed."

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="argus-${VERSION}-linux-amd64"

          test -s "dist/${PACKAGE}.tar.gz"
          test -s "dist/SHA256SUMS"

          echo "Both required release files exist."

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: argus-release-${{ env.VERSION }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: argus-release-${{ needs.package.outputs.version }}
          path: release-files

      - name: Verify downloaded release artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail

          PACKAGE="argus-${RELEASE_VERSION}-linux-amd64"

          test -s "release-files/${PACKAGE}.tar.gz"
          test -s "release-files/SHA256SUMS"

          cd release-files

          EXPECTED_ENTRY="$(sha256sum "${PACKAGE}.tar.gz")"

          grep -Fxq -- "$EXPECTED_ENTRY" SHA256SUMS

          sha256sum -c SHA256SUMS

          echo "Downloaded release artifact verified successfully."

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail

          EXPECTED_TAG="v${RELEASE_VERSION}"

          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "Release tag mismatch."
            exit 1
          fi

          PACKAGE="argus-${RELEASE_VERSION}-linux-amd64"

          gh release create "$EXPECTED_TAG" \
            "release-files/${PACKAGE}.tar.gz" \
            "release-files/SHA256SUMS" \
            --title "Argus ${EXPECTED_TAG}" \
            --generate-notes

          echo "GitHub Release ${EXPECTED_TAG} published successfully."